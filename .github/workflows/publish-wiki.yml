name: Publish wiki

on:
  push:
    branches: [master]
    paths:
      - 'Wiki/**'
      - 'Source/Veronica/Skills/**'
      - 'Source/Veronica/Wiki/**'
      - 'Eval/Tasks/*.md'
      - '.github/scripts/publish_wiki.py'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages
        run: python3 .github/scripts/publish_wiki.py "$RUNNER_TEMP/wiki-out"

      - name: Push to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/wiki-out/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Publish ${GITHUB_SHA::7}"
          git push
